<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- White card -->
  <rect x="60" y="80" width="392" height="352" rx="30" fill="white" opacity="0.95"/>
  <!-- Math symbol + -->
  <circle cx="180" cy="200" r="40" fill="#FF6B6B"/>
  <rect x="168" y="188" width="24" height="24" rx="4" fill="white"/>
  <rect x="180" y="176" width="24" height="24" rx="4" fill="white" transform="rotate(0 180 200)"/>
  <!-- Math symbol - -->
  <circle cx="332" cy="200" r="40" fill="#4ECDC4"/>
  <rect x="316" y="192" width="32" height="16" rx="4" fill="white"/>
  <!-- Star decoration -->
  <polygon points="256,130 268,160 300,160 275,178 284,210 256,192 228,210 237,178 212,160 244,160" fill="#FFD93D"/>
  <!-- Equals symbol -->
  <rect x="220" y="280" width="72" height="12" rx="6" fill="#667eea"/>
  <rect x="220" y="310" width="72" height="12" rx="6" fill="#667eea"/>
  <!-- Question mark -->
  <text x="320" y="330" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="#764ba2">?</text>
  <!-- Small dots decoration -->
  <circle cx="100" cy="120" r="8" fill="#FFD93D" opacity="0.6"/>
  <circle cx="420" cy="380" r="10" fill="#FF6B6B" opacity="0.6"/>
  <circle cx="400" cy="120" r="6" fill="#4ECDC4" opacity="0.6"/>
  <circle cx="120" cy="390" r="7" fill="#FFD93D" opacity="0.6"/>
</svg>
