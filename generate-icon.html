<!DOCTYPE html>
<html>
<head>
    <title>生成图标</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 40px; background: #f5f5f5; }
        canvas { border: 1px solid #ddd; margin: 20px; border-radius: 20px; }
        button { padding: 12px 24px; font-size: 16px; cursor: pointer; margin: 10px; border: none; border-radius: 8px; background: #667eea; color: white; }
        button:hover { background: #5a6fd6; }
    </style>
</head>
<body>
    <h1>图标生成器</h1>
    <p>点击下方按钮生成不同尺寸的 PNG 图标</p>
    <div>
        <canvas id="c180" width="180" height="180"></canvas>
        <p>180x180 (Apple Touch Icon)</p>
        <button onclick="download(180)">下载</button>
    </div>
    <div>
        <canvas id="c192" width="192" height="192"></canvas>
        <p>192x192 (Android)</p>
        <button onclick="download(192)">下载</button>
    </div>
    <div>
        <canvas id="c512" width="512" height="512"></canvas>
        <p>512x512 (PWA)</p>
        <button onclick="download(512)">下载</button>
    </div>

    <script>
        const svgContent = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
          <defs>
            <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#667eea"/>
              <stop offset="100%" style="stop-color:#764ba2"/>
            </linearGradient>
          </defs>
          <rect width="512" height="512" rx="100" fill="url(#bg)"/>
          <rect x="60" y="80" width="392" height="352" rx="30" fill="white" opacity="0.95"/>
          <circle cx="180" cy="200" r="40" fill="#FF6B6B"/>
          <rect x="168" y="188" width="24" height="24" rx="4" fill="white"/>
          <rect x="180" y="176" width="24" height="24" rx="4" fill="white" transform="rotate(0 180 200)"/>
          <circle cx="332" cy="200" r="40" fill="#4ECDC4"/>
          <rect x="316" y="192" width="32" height="16" rx="4" fill="white"/>
          <polygon points="256,130 268,160 300,160 275,178 284,210 256,192 228,210 237,178 212,160 244,160" fill="#FFD93D"/>
          <rect x="220" y="280" width="72" height="12" rx="6" fill="#667eea"/>
          <rect x="220" y="310" width="72" height="12" rx="6" fill="#667eea"/>
          <text x="320" y="330" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="#764ba2">?</text>
          <circle cx="100" cy="120" r="8" fill="#FFD93D" opacity="0.6"/>
          <circle cx="420" cy="380" r="10" fill="#FF6B6B" opacity="0.6"/>
          <circle cx="400" cy="120" r="6" fill="#4ECDC4" opacity="0.6"/>
          <circle cx="120" cy="390" r="7" fill="#FFD93D" opacity="0.6"/>
        </svg>`;

        function drawIcon(canvasId, size) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            const img = new Image();
            const blob = new Blob([svgContent], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);

            img.onload = function() {
                ctx.drawImage(img, 0, 0, size, size);
                URL.revokeObjectURL(url);
            };
            img.src = url;
        }

        function download(size) {
            const canvas = size === 180 ? document.getElementById('c180') :
                          size === 192 ? document.getElementById('c192') :
                          document.getElementById('c512');
            const link = document.createElement('a');
            link.download = `icon-${size}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        drawIcon('c180', 180);
        drawIcon('c192', 192);
        drawIcon('c512', 512);
    </script>
</body>
</html>
